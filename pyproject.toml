[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hishel"
version = "1.4.0"
description = " Elegant HTTP Caching for Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kar Petrosyan", email = "kar.petrosyanpy@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: Trio",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "msgpack>=1.2.4",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]

async = [
    "anyio>=4.15.1",
    "anysqlite>=0.0.5",
]

requests = [
    "requests>=2.34.2",
]
httpx = [
    "httpx>=0.28.1",
    # install async extra
    "anyio>=4.15.1",
    "anysqlite>=0.0.5",
]
httpx2 = [
    "httpx2>=2.14.0",
    # install async extra
    "anyio>=4.15.1",
    "anysqlite>=0.0.5",
]
fastapi = [
    "fastapi>=0.162.0",
]
redis = [
    "redis>=8.1.0",
]

[project.urls]
Homepage = "https://hishel.com"
Source = "https://github.com/karpetrosyan/hishel"

[tool.mypy]
strict = true
show_error_codes = true
warn_unused_ignores = false
exclude = ['venv', '.venv']

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["time_machine.*", "msgpack.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["-rxXs", "--strict-config", "--strict-markers"]
filterwarnings = []
pythonpath = ["src"]

[tool.coverage.report]
exclude_also = ['__repr__', 'raise NotImplementedError()']

[tool.ruff]
exclude = [
    "src/hishel/_sync",
    "src/hishel/__init__.py",
    "tests/_sync",
    "src/hishel/_core/_sync",
    "tests/_core/_sync",
    "src/hishel/_sync_cache.py",
    "tests/test_sync_httpx.py",
    "tests/test_sync_httpx2.py",
    "src/hishel/_core/_storages/_sync_sqlite.py",
    "src/hishel/_core/_storages/_sync_redis.py",
    "src/hishel/_core/_storages/_sync_base.py",
    "src/hishel/_sync_httpx.py",
    "src/hishel/_sync_httpx2.py"
]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true


[dependency-groups]
dev = [
    "anyio==4.15.1",
    "anysqlite>=0.0.5",
    "coverage==7.16.2",
    "fastapi[standard]>=0.162.0",
    "hatch==1.18.2",
    "inline-snapshot>=0.36.1",
    "mike>=2.2.0",
    "mkdocs==1.6.1",
    "mkdocs-git-committers-plugin>=0.2.3",
    "mkdocs-git-revision-date-localized-plugin>=1.6.2",
    "mkdocs-material==9.7.7",
    "mypy==2.4.1",
    "pyright>=1.1.414",
    "pytest==9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-icdiff>=0.9",
    "ruff==0.17.3",
    "time-machine>=3.5.1",
    "trio==0.34.0",
    "types-boto3==1.43.121",
    "types-pyyaml==6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
    "fakeredis>=2.40.0",
    "redis>=8.1.0",
    "zipp>=4.1.2",
    "types-redis>=4.6.0.20241004",
]
